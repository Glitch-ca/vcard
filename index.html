<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(160deg,#0B2F5C 0%,#15549A 100%);color:#fff;min-height:100vh;display:flex;justify-content:center;padding:12px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:16px 20px 16px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.35);min-height:calc(100svh - 24px);display:flex;flex-direction:column}
.draft{background:#D7263D;color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;border-radius:6px;padding:4px 8px;display:inline-block;margin-bottom:12px}
.avatar{width:132px;height:132px;margin:0 auto 12px;border-radius:50%;overflow:hidden;border:4px solid #FEAA36}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-family:Georgia,"Times New Roman",serif;font-size:27px;line-height:1.1}
.title{color:#dbe6f5;font-size:15px;margin-top:4px}
.org{margin-top:12px} .org img{width:225px;max-width:100%;height:auto;display:inline-block;background:#fff;border-radius:11px;padding:7px 14px}
.qrbox{background:#fff;border-radius:18px;padding:14px;margin:0 auto;width:236px}
.qrbox img{width:208px;height:208px;display:block}
.slogan{color:#FEAA36;font-weight:700;font-style:italic;font-size:15px;margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border-radius:14px;font-size:17px;font-weight:600;text-decoration:none;margin-bottom:10px;color:#fff}
.btn svg{width:20px;height:20px;fill:currentColor}
.save{background:#FEAA36;color:#0B2F5C} .fb{background:#1877F2}
.row{display:flex;gap:10px} .row .btn{background:rgba(255,255,255,.14);font-size:16px}
.hint{font-size:12px;color:#c9d6ea;margin-top:2px}
.loc{font-size:13px;color:#dbe6f5;margin-top:6px}
.lic{padding-top:12px;border-top:1px solid rgba(255,255,255,.18);font-size:11px;color:#dbe6f5;line-height:1.5}
.draft{align-self:center}
.groups{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.row .btn{margin-bottom:0}
/* entrance animation (subtle) */
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(254,170,54,.75)}100%{box-shadow:0 0 0 16px rgba(254,170,54,0)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 26px 6px rgba(254,170,54,.55)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.avatar{animation:popIn .5s ease-out both,ring .55s ease-out .5s 1}
.g1 h1,.g1 .title,.g1 .slogan,.g2,.g3,.g4{animation:rise .45s ease-out both}
.g1 h1{animation-delay:.35s} .g1 .title{animation-delay:.45s} .g1 .slogan{animation-delay:.55s}
.g2{animation-delay:.65s} .g3{animation-delay:.8s} .g4{animation-delay:.95s}
.qrbox{animation:glow .5s ease-in-out 1s 1}
.btn{transition:transform .12s ease,filter .12s ease;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.96);filter:brightness(.95)}
.save.done{background:#2E9E5B;color:#fff} .fb.done{background:#0E5FCC}
.save.kept{background:#3FA56B;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)} .fb.kept{background:#1559B8;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
